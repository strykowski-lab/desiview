[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desiview"
version = "0.1.0"
description = "3D viewer for the DESI DR1 QSO source distribution."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Mali Land-Strykowski"},
]
keywords = ["cosmology", "desi", "quasars", "large-scale-structure", "dipole", "visualisation", "webgl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
desiview = "desiview.cli:main"

[project.urls]
Homepage = "https://github.com/strykowski-lab/desiview"
Repository = "https://github.com/strykowski-lab/desiview"
Issues = "https://github.com/strykowski-lab/desiview/issues"

[tool.setuptools.packages.find]
include = ["desiview*"]

[tool.setuptools.package-data]
desiview = ["templates/*.html", "templates/*.css", "templates/js/*.js"]
